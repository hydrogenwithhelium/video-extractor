<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Extract the media URL from a wrapper URL.">
  <title>URL Extractor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #172033;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 14px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: #2563eb;
      color: white;
      font-size: 26px;
      font-weight: 800;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
    }

    h1 {
      font-size: clamp(28px, 5vw, 40px);
      margin-bottom: 8px;
    }

    .subtitle {
      color: #68738a;
      line-height: 1.6;
    }

    .card {
      background: white;
      border: 1px solid #e5e9f2;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 15px 40px rgba(31, 41, 55, 0.07);
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 9px;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      border: 1px solid #d8deea;
      border-radius: 12px;
      padding: 14px;
      font: inherit;
      color: #172033;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #eef2f7;
      color: #263247;
    }

    .success {
      background: #16a34a;
      color: white;
    }

    .danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .result {
      display: none;
      margin-top: 24px;
      border-top: 1px solid #e8ecf3;
      padding-top: 24px;
    }

    .result.show {
      display: block;
    }

    .result-title {
      font-weight: 800;
      margin-bottom: 10px;
    }

    .url-box {
      background: #f7f9fc;
      border: 1px solid #e0e5ee;
      border-radius: 12px;
      padding: 14px;
      word-break: break-all;
      line-height: 1.55;
      font-size: 14px;
    }

    .status {
      min-height: 24px;
      margin-top: 14px;
      font-size: 14px;
      font-weight: 600;
    }

    .status.error {
      color: #dc2626;
    }

    .status.ok {
      color: #16a34a;
    }

    .info {
      margin-top: 24px;
      padding: 15px;
      border-radius: 12px;
      background: #eff6ff;
      color: #1e40af;
      font-size: 13px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      color: #8993a5;
      font-size: 13px;
      margin-top: 22px;
    }

    @media (max-width: 520px) {
      body {
        padding-top: 24px;
      }

      .card {
        padding: 18px;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <div class="logo">↗</div>
      <h1>URL Extractor</h1>
      <p class="subtitle">
        Extract the destination URL from a wrapper link.
      </p>
    </header>

    <section class="card">

      <label for="inputUrl">Wrapper URL</label>

      <textarea
        id="inputUrl"
        placeholder="Paste your wrapper URL here..."
        spellcheck="false"
      ></textarea>

      <div class="actions">
        <button class="primary" id="extractBtn">
          Extract URL
        </button>

        <button class="secondary" id="pasteBtn">
          Paste
        </button>

        <button class="danger" id="clearBtn">
          Clear
        </button>
      </div>

      <div class="status" id="status"></div>

      <div class="result" id="result">

        <div class="result-title">
          Extracted URL
        </div>

        <div class="url-box" id="outputUrl"></div>

        <div class="actions">
          <button class="success" id="copyBtn">
            Copy URL
          </button>

          <button class="secondary" id="openBtn">
            Open URL
          </button>
        </div>

      </div>

      <div class="info">
        <strong>How it works:</strong>
        This tool reads the <code>url</code> query parameter from the
        wrapper URL and decodes it in your browser. Nothing is uploaded
        to a server.
      </div>

    </section>

    <footer>
      Runs entirely in your browser.
    </footer>

  </main>

  <script>
    const input = document.getElementById("inputUrl");
    const extractBtn = document.getElementById("extractBtn");
    const pasteBtn = document.getElementById("pasteBtn");
    const clearBtn = document.getElementById("clearBtn");
    const copyBtn = document.getElementById("copyBtn");
    const openBtn = document.getElementById("openBtn");

    const result = document.getElementById("result");
    const output = document.getElementById("outputUrl");
    const status = document.getElementById("status");

    let extractedUrl = "";

    function setStatus(message, type = "") {
      status.textContent = message;
      status.className = "status " + type;
    }

    function extractUrl() {
      const value = input.value.trim();

      result.classList.remove("show");
      extractedUrl = "";
      setStatus("");

      if (!value) {
        setStatus("Please paste a URL first.", "error");
        return;
      }

      let parsed;

      try {
        parsed = new URL(value);
      } catch {
        setStatus("That does not appear to be a valid URL.", "error");
        return;
      }

      const target = parsed.searchParams.get("url");

      if (!target) {
        setStatus(
          'No "url" parameter was found in this wrapper URL.',
          "error"
        );
        return;
      }

      try {
        extractedUrl = new URL(target, parsed.origin).href;
      } catch {
        setStatus("The URL parameter is not a valid destination URL.", "error");
        return;
      }

      output.textContent = extractedUrl;
      result.classList.add("show");

      setStatus("URL extracted successfully.", "ok");
    }

    extractBtn.addEventListener("click", extractUrl);

    clearBtn.addEventListener("click", () => {
      input.value = "";
      output.textContent = "";
      extractedUrl = "";
      result.classList.remove("show");
      setStatus("");
      input.focus();
    });

    pasteBtn.addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();

        if (!text) {
          setStatus("Clipboard is empty.", "error");
          return;
        }

        input.value = text;
        setStatus("URL pasted. Click Extract URL.", "ok");
      } catch {
        setStatus(
          "Clipboard access was blocked. Paste the URL manually.",
          "error"
        );
      }
    });

    copyBtn.addEventListener("click", async () => {
      if (!extractedUrl) return;

      try {
        await navigator.clipboard.writeText(extractedUrl);
        setStatus("URL copied to clipboard.", "ok");
      } catch {
        setStatus(
          "Could not access the clipboard. Copy the URL manually.",
          "error"
        );
      }
    });

    openBtn.addEventListener("click", () => {
      if (!extractedUrl) return;

      window.open(extractedUrl, "_blank", "noopener,noreferrer");
    });

    input.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        extractUrl();
      }
    });
  </script>
</body>
</html>
